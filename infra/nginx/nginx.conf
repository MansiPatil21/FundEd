# One origin for the whole product: the site at /, the API beneath it. Same origin means no
# CORS in production and no API address baked into the frontend.

upstream web { server web:3000; }
upstream api { server api:4000; }

# Pass WebSocket upgrades through for Socket.IO, and close ordinary connections normally.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  client_max_body_size 1m;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://api;
    # The uncertainty estimate replays a plan across many rate paths and can take tens of
    # seconds, well past Nginx's 60-second default being comfortable.
    proxy_read_timeout 120s;
  }

  location /graphql  { proxy_pass http://api; }
  location /webhooks/ { proxy_pass http://api; }
  location = /health { proxy_pass http://api; }

  location /socket.io/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  location / { proxy_pass http://web; }
}
