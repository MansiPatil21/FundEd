apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # One replica on purpose. The exchange-rate poller and the Socket.IO rooms live in the process,
  # so a second replica would poll twice and miss alerts for sockets held by the other one.
  # Scaling out needs the Socket.IO Redis adapter and a single poller first.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      # Creates the indexes, including the unique ones correctness depends on, before the API
      # starts. Idempotent, and retried with backoff until MongoDB has elected a primary.
      initContainers:
        - name: migrate
          image: funded-api
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "db", "push", "--skip-generate"]
          envFrom:
            - configMapRef: { name: funded-config }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      containers:
        - name: api
          image: funded-api
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: funded-config }
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: funded-secrets, key: JWT_SECRET }
            - name: FX_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: funded-secrets, key: FX_WEBHOOK_SECRET }
            - name: OPTIMIZER_API_KEY
              valueFrom:
                secretKeyRef: { name: funded-secrets, key: OPTIMIZER_API_KEY }
          ports:
            - name: http
              containerPort: 4000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          # Liveness asks only whether the process answers, so a database outage does not restart
          # a healthy API. Readiness checks every dependency, so traffic stops while one is down.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
