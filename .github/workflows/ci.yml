name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (Node, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB as a single-node replica set
        # Service containers cannot take command arguments, and Prisma needs a replica set.
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }" >/dev/null 2>&1 || true
            docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" 2>/dev/null | grep -q true && break
            sleep 2
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Create indexes in every test database
        # Each integration suite uses its own database, and the unique indexes are part of
        # what the tests assert, so they must exist before the suites run.
        run: |
          suites=$(grep -rhoE "testDatabase\('[a-z_]+'\)" src | sed -E "s/testDatabase\('([a-z_]+)'\)/_\1/" | sort -u)
          for suffix in "" $suites; do
            DATABASE_URL="mongodb://localhost:27017/funded_test${suffix}?replicaSet=rs0&directConnection=true" \
              npx prisma db push --skip-generate
          done
      - run: npx tsc --noEmit
      - run: npx jest --ci

  optimizer:
    name: Optimizer (Python, OR-Tools)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: optimizer/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, optimizer, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build every service image
        env:
          JWT_SECRET: ci-only-secret-that-is-long-enough
          FX_WEBHOOK_SECRET: ci-only-webhook-secret
        run: docker compose --profile full build
